<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹 구조 지도</title>
<!--
  붙여 넣는 방법
  이 파일 하나로 동작합니다. 외부 스크립트와 폰트를 부르지 않습니다.

    <iframe src="웹구조그래프.html" style="width:100%;aspect-ratio:16/9;border:0" loading="lazy"></iframe>

  주소 뒤에 붙이는 설정
    ?ratio=9:16   세로 화면 (기본값 16:9)
    ?autoplay=0   시작 연출을 건너뛰고 완성된 지도부터 보여 주기
    ?stage=6      연출의 한 단계에서 멈추기 (0에서 9까지)
    ?q=여름       그 낱말이 걸린 페이지만 밝히기

  강의 자리에서 쓰는 키
    스페이스바    멈추고 이어 보기
    R             시작 연출 다시

  연출 단계
    0 회색 먼지 1,151개       1 자리 잡고 색이 켜짐    2 조회수만큼 부풀어 오름
    3 묶음을 하나씩 짚어 소개  4 이동 흔적 4,580갈래    5 바깥 고리에 유입원
    6 안쪽에 결제 층          7 캠페인 이름으로 두 층을 이음
    8 오간 길이 없는 페이지가 물러남
    9 1년을 하루씩 지나가며 후원 퍼널과 모금액이 쌓임. 마지막 날에 스스로 멈춤

  숫자는 9단계에서 날짜와 함께 오를 때만 보입니다. 그 전에는 띄우지 않습니다.
-->
<style>
  :root { --ink:#eaf0ff; --dim:#8b97b8; --line:rgba(150,170,220,.16); }
  * { box-sizing:border-box; }
  html, body {
    margin:0; padding:0; height:100%; background:#04060d; color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                "Noto Sans KR", "Malgun Gothic", "맑은 고딕", sans-serif;
    overflow:hidden;
  }
  #wrap { position:relative; width:100%; height:100%; display:flex;
          align-items:center; justify-content:center; background:#04060d; }
  #stage { position:relative; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  canvas.drag { cursor:grabbing; }

  #bar {
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:10px 14px; font-size:12px;
    background:linear-gradient(to top, rgba(4,6,13,.94), rgba(4,6,13,0));
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  #stage:hover #bar, #bar:focus-within, #bar.show { opacity:1; pointer-events:auto; }
  #bar button.off { color:#ffd479; border-color:rgba(255,212,121,.5); }
  button, select, input[type=search] {
    background:rgba(255,255,255,.07); color:var(--ink);
    border:1px solid var(--line); border-radius:6px;
    padding:5px 10px; font:inherit; font-size:12px; cursor:pointer; line-height:1.4;
  }
  input[type=search] { cursor:text; min-width:150px; }
  button:hover, select:hover { background:rgba(255,255,255,.14); }
  button:active { transform:translateY(1px); }
  button.off { opacity:.42; }
  .sep { width:1px; height:18px; background:var(--line); }
  .grow { flex:1; }

  /* 노드를 눌렀을 때 뜨는 설명 패널 */
  #panel {
    position:absolute; right:16px; top:16px; width:290px; max-width:46%;
    background:rgba(9,13,26,.90); border:1px solid var(--line);
    border-radius:10px; padding:14px 16px; font-size:12px; line-height:1.65;
    display:none; backdrop-filter:blur(8px);
  }
  #panel.on { display:block; }
  #panel h3 { margin:0 0 6px; font-size:14px; line-height:1.4; }
  #panel .path { color:var(--dim); word-break:break-all; margin-bottom:9px; font-size:11px; }
  #panel dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:0; }
  #panel dt { color:var(--dim); }
  #panel dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  #panel .x { position:absolute; right:10px; top:8px; padding:2px 7px; font-size:12px; }
  @media (max-width:620px) {
    #bar { font-size:11px; padding:8px 10px; gap:6px; }
    button, select, input[type=search] { padding:4px 7px; font-size:11px; }
    input[type=search] { min-width:104px; }
    #panel { width:210px; font-size:11px; padding:11px 12px; }
  }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="panel"><button class="x" id="pclose">닫기</button><div id="pbody"></div></div>
  <div id="bar">
    <button id="play" title="멈추고 이어 보기 (스페이스바)">멈춤</button>
    <button id="replay" title="시작 연출 다시 보기">연출 다시</button>
    <input id="q" type="search" placeholder="페이지나 캠페인 검색" aria-label="검색">
    <span class="sep"></span>
    <button class="tg" data-layer="src">유입원</button>
    <button class="tg" data-layer="web">콘텐츠</button>
    <button class="tg" data-layer="pay">결제</button>
    <button class="tg" data-layer="flow">흐름</button>
    <span class="sep"></span>
    <button id="fit" title="전체 보기">전체 보기</button>
    <select id="ratio" title="화면비">
      <option value="16:9" selected>16:9</option>
      <option value="9:16">9:16</option>
    </select>
    <button id="full">전체 화면</button>
  </div>
</div></div>

<script>
"use strict";
const G = /*__GRAPH_DATA__*/null;

/* ================================================================== *
 * 설정
 * ================================================================== */
const P = new URLSearchParams(location.search);
const CFG = {
  ratio: P.get("ratio") === "9:16" ? "9:16" : "16:9",
  autoplay: P.get("autoplay") !== "0",
};

/* 시작 연출 단계. 누적 시간(초)과 이름. */
const SCENES = [
  { t: 2.4, k: "dust",   cap: "웹 페이지 " + G.meta.pages.toLocaleString("ko-KR") + "개" },
  { t: 8.0, k: "settle", cap: "무엇에 관한 페이지인지 색으로 구분합니다" },
  { t: 6.4, k: "size",   cap: "많이 읽힌 페이지일수록 크게 표시됩니다" },
  { t: 50.4, k: "tour",  cap: "" },
  { t: 6.0, k: "links",  cap: "페이지 사이를 오간 흔적 " + G.meta.edges.toLocaleString("ko-KR") + "개" },
  { t: 6.4, k: "src",    cap: "밖에서 들어온 유입이 원 외곽에 행성처럼 붙었습니다" },
  { t: 7.6, k: "pay",    cap: "후원은 서로 다른 도메인(mrm)에서 일어납니다" },
  { t: 7.0, k: "bridge", cap: "캠페인 이름으로 두 웹사이트를 하나로 잇습니다" },
  { t: 7.2, k: "prune",  cap: "오간 흔적이 없는 페이지는 제외하고 보겠습니다." },
  { t: 999, k: "flow",   cap: "1년을 하루씩 다시 지나갑니다" },
];
const SCENE_END = [];
(function () { let a = 0; for (const s of SCENES) { a += s.t; SCENE_END.push(a); } })();
const KIDX = {}; SCENES.forEach((s, i) => KIDX[s.k] = i);

const CATC = G.cats.map(c => c.color);
const CHAN_COLOR = {
  "Display": "#FF8A5B", "Paid Social": "#FF6FA5", "Organic Social": "#FF9CC2",
  "Organic Search": "#5AD1A0", "Paid Search": "#7BE3C0", "Direct": "#9FB4FF",
  "Referral": "#C9A6FF", "SMS": "#FFD166", "Email": "#FFC0A0", "Unassigned": "#8B97B8",
};
const chanColor = c => CHAN_COLOR[c] || "#8B97B8";

/* ================================================================== *
 * 화면
 * ================================================================== */
const cv = document.getElementById("cv");
const mainCtx = cv.getContext("2d", { alpha: false });
let ctx = mainCtx;   // withCtx가 잠깐 오프스크린으로 바꿔치기한다
const stageEl = document.getElementById("stage");
let W = 1920, H = 1080, RX = 1, RY = 1;
// 세로 화면은 폭이 좁고 높이가 남는다. 타원으로 늘려 화면을 채운다.

function layoutSize() {
  const vertical = CFG.ratio === "9:16";
  W = vertical ? 1080 : 1920;
  H = vertical ? 1920 : 1080;
  const box = document.getElementById("wrap").getBoundingClientRect();
  const k = Math.min(box.width / W, box.height / H);
  stageEl.style.width = Math.floor(W * k) + "px";
  stageEl.style.height = Math.floor(H * k) + "px";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (vertical) { RX = W * 0.30; RY = RX * 1.42; }
  else { RX = RY = Math.min(W, H) * 0.40; }
  makeStars();
}
window.addEventListener("resize", layoutSize);

/* 별 */
let stars = [];
function makeStars() {
  const n = Math.round(W * H / 6000);
  let s = 20260826;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  stars = [];
  for (let i = 0; i < n; i++)
    stars.push({ x: rnd() * W, y: rnd() * H, r: .35 + rnd() * rnd() * 1.7,
                 a: .14 + rnd() * .5, tw: rnd() * 6.28, sp: .3 + rnd() * .9 });
}

/* ================================================================== *
 * 좌표
 * ================================================================== */
const cam = { x: 0, y: 0, z: 1, tx: 0, ty: 0, tz: 1 };
const sx = gx => (gx - cam.x) * RX * cam.z + W / 2;
const sy = gy => (gy - cam.y) * RY * cam.z + H / 2;
const RM = () => (RX + RY) / 2;

/* 노드마다 시작 위치(먼지)와 목표 위치를 둔다 */
const N = G.nodes.length;
const nx0 = new Float32Array(N), ny0 = new Float32Array(N);
(function () {
  let s = 424242;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < N; i++) {
    const a = rnd() * 6.283, r = Math.sqrt(rnd()) * 1.15;
    nx0[i] = Math.cos(a) * r; ny0[i] = Math.sin(a) * r;
  }
})();
const maxPV = Math.max(...G.nodes.map(n => n.pv), 1);
const logMax = Math.log1p(maxPV);
const nodeR = G.nodes.map(n => 1.6 + 18 * Math.pow(Math.log1p(n.pv) / logMax, 1.8));
const maxSrc = Math.max(...G.srcs.map(s => s.v), 1);
const maxCamp = Math.max(...G.camps.map(c => c.rev), 1);

/* ================================================================== *
 * 유입원의 공전
 * 유입원은 달처럼 웹 바깥을 천천히 돕니다. 한 바퀴에 3분 안팎이라
 * 화면을 보는 동안에는 아주 느린 이동으로만 보입니다.
 * ================================================================== */
const ORBIT = G.srcs.map((s, i) => {
  const r = Math.hypot(s.x, s.y) || 1;
  const j = (i * 0.6180339887) % 1;             // 황금비로 흩어 놓은 차이값
  return {
    r: r * (0.94 + j * 0.13),                   // 고리를 조금 벌려 서로 스쳐 지나가게 한다
    a: Math.atan2(s.y, s.x),
    w: 0.0300 * (0.82 + j * 0.36),              // 각속도(라디안/초)
    bob: 0.016 + j * 0.010,                     // 반지름이 아주 조금 늘었다 줄었다 한다
    ph: j * 6.283,
  };
});
const ORBIT_R = ORBIT.reduce((a, o) => a + o.r, 0) / (ORBIT.length || 1);

function srcX(i) {
  const o = ORBIT[i];
  return Math.cos(o.a + st.t * o.w) * o.r * (1 + o.bob * Math.sin(st.t * 0.27 + o.ph));
}
function srcY(i) {
  const o = ORBIT[i];
  return Math.sin(o.a + st.t * o.w) * o.r * (1 + o.bob * Math.sin(st.t * 0.27 + o.ph));
}

/* 간선을 굵기별로 묶어 한 번에 그린다. 5천 개를 하나씩 그리면 느리다. */
const EBUCKET = [[], [], [], []];
(function () {
  const mx = Math.max(...G.edges.map(e => e[2]), 1);
  for (const e of G.edges) {
    const q = e[2] / mx;
    EBUCKET[q > .12 ? 3 : q > .03 ? 2 : q > .008 ? 1 : 0].push(e);
  }
})();
const EALPHA = [.13, .21, .34, .62];
const EWIDTH = [.6, .8, 1.15, 1.9];

/* ================================================================== *
 * 흐름 입자
 * ================================================================== */
const ROUTES = [];
(function () {
  const landOf = new Map();          // 유입원 -> [[페이지, 세션]]
  for (const [si, ni, v] of G.srcEdges) {
    if (!landOf.has(si)) landOf.set(si, []);
    landOf.get(si).push([ni, v]);
  }
  const campOfPage = new Map();      // 캠페인 페이지 -> 결제 캠페인
  for (const [ni, ci, v] of G.campEdges) campOfPage.set(ni, ci);
  const outOf = new Map();           // 페이지 -> 이어진 페이지
  for (const [a, b, v] of G.edges) {
    if (!outOf.has(a)) outOf.set(a, []);
    if (outOf.get(a).length < 8) outOf.get(a).push(b);
  }
  const campPages = [...campOfPage.keys()];

  // 콘텐츠를 거쳐 결제까지 가는 길
  for (const [si, lands] of landOf) {
    for (const [ni, v] of lands.slice(0, 3)) {
      const path = [{ k: "s", i: si }, { k: "n", i: ni }];
      let ci = campOfPage.get(ni);
      if (ci === undefined) {
        const nxt = (outOf.get(ni) || []).find(x => campOfPage.has(x));
        if (nxt !== undefined) { path.push({ k: "n", i: nxt }); ci = campOfPage.get(nxt); }
        else {
          const hop = (outOf.get(ni) || [])[0];
          if (hop !== undefined) path.push({ k: "n", i: hop });
          ci = campOfPage.get(campPages[(si * 3) % campPages.length]);
        }
      }
      if (ci === undefined) continue;
      path.push({ k: "c", i: ci }, { k: "core" });
      ROUTES.push({ w: v, path });
    }
  }
  // 광고에서 결제로 바로 가는 길
  for (const [si, ci, v] of G.adEdges)
    ROUTES.push({ w: v * 1.2, path: [{ k: "s", i: si }, { k: "c", i: ci }, { k: "core" }], est: true });

  const tot = ROUTES.reduce((a, r) => a + r.w, 0) || 1;
  let acc = 0;
  for (const r of ROUTES) { acc += r.w / tot; r.cum = acc; }
})();

/* ================================================================== *
 * 살아 있는 연결
 * 이동 흔적 4,580갈래를 늘 켜 두면 왼쪽 덩어리가 한 장의 그물로 뭉쳐 보입니다.
 * 흐름이 지나간 자리만 밝히고 나머지는 서서히 가라앉게 합니다.
 * ================================================================== */
const E = G.edges.length;
const eAct = new Float32Array(E);          // 간선의 밝기. 흐름이 지나가면 1이 되고 시간이 지나면 준다
const nAct = new Float32Array(N);          // 페이지의 밝기. 같은 방식으로 준다
const OUT_E = new Map();                   // 페이지 -> 그 페이지에서 나가는 간선 번호
(function () {
  for (let i = 0; i < E; i++) {
    const a = G.edges[i][0];
    if (!OUT_E.has(a)) OUT_E.set(a, []);
    const list = OUT_E.get(a);
    if (list.length < 10) list.push(i);
  }
})();
/* 흐름이 시작되는 자리는 이동량이 많은 간선일수록 자주 뽑힌다 */
const ECUM = new Float32Array(E);
(function () {
  let acc = 0;
  for (let i = 0; i < E; i++) { acc += Math.pow(G.edges[i][2], 0.65); ECUM[i] = acc; }
  for (let i = 0; i < E; i++) ECUM[i] /= acc || 1;
})();
function pickEdge() {
  const u = Math.random();
  let lo = 0, hi = E - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (ECUM[m] < u) lo = m + 1; else hi = m; }
  return lo;
}

const walkers = [];
const WALK_MAX = 68;
let walkBudget = 0;

/* 느린 기기에서는 흐름의 양을 줄인다. 한 번 줄이면 다시 넉넉해질 때까지 유지한다. */
let heavy = false;
function loadWatch(dt) {
  st.load = st.load * .94 + dt * .06;
  if (!heavy && st.load > .033) heavy = true;
  else if (heavy && st.load < .020) heavy = false;
}
const qual = () => (heavy ? .5 : 1);

function stepWalkers(dt) {
  // 새 흐름을 뿌린다
  walkBudget += dt * 19 * qual();
  while (walkBudget >= 1 && walkers.length < WALK_MAX * qual()) {
    walkBudget -= 1;
    walkers.push({ e: pickEdge(), t: 0, sp: 1.5 + Math.random() * 1.7, life: 0 });
  }
  if (walkBudget > 3) walkBudget = 3;

  for (let i = walkers.length - 1; i >= 0; i--) {
    const w = walkers[i];
    w.t += w.sp * dt;
    const cur = G.edges[w.e];
    // 지나가는 자리를 밝힌다
    if (eAct[w.e] < 1) eAct[w.e] = 1;
    if (nAct[cur[0]] < 1) nAct[cur[0]] = 1;
    while (w.t >= 1) {
      w.t -= 1;
      w.life += 1;
      nAct[cur[1]] = 1;
      const next = OUT_E.get(cur[1]);
      // 길이 끊기거나 너무 멀리 가면 흐름을 놓아 준다
      if (!next || !next.length || w.life > 5 || Math.random() > 0.74) { walkers.splice(i, 1); break; }
      w.e = next[(Math.random() * next.length) | 0];
      eAct[w.e] = 1;
    }
  }
  // 밝기는 몇 초에 걸쳐 가라앉는다
  const kE = Math.exp(-dt / 1.35), kN = Math.exp(-dt / 1.05);
  for (let i = 0; i < E; i++) if (eAct[i] > 0.001) eAct[i] *= kE;
  for (let i = 0; i < N; i++) if (nAct[i] > 0.001) nAct[i] *= kN;
}

/* 흐름 연출이 얼마나 켜졌는가. 층 단추로 흐름을 끄면 연결이 모두 돌아온다. */
function flowMix() { return st.layers.flow ? ease(st.prog.flow) : 0; }
function pruneMix() { return ease(st.prog.prune); }

/* 페이지끼리 이어진 선의 밝기.
   흔적을 한 번 펼쳐 보인 뒤 다음 장면으로 넘어가며 걷는다.
   걷지 않으면 유입원과 결제 층이 올라올 때 그물에 묻혀 보이지 않는다. */
function webEdgeMix() {
  if (st.match) return 1;               // 검색 중에는 이어진 곳을 봐야 한다
  if (!st.intro) return 0;
  const k = KIDX.links;
  if (st.scene < k) return 0;
  if (st.scene === k) return ease(st.prog.links);
  if (st.scene === k + 1) return Math.max(0, 1 - st.sceneT / 1.8);
  return 0;
}

/* 묶음을 하나씩 짚어 보여 주는 장면. 지금 어느 묶음을 비추고 있는지 돌려준다. */
function tourNow() {
  if (!st.intro || st.frozen) return null;
  const sc = SCENES[st.scene];
  if (!sc || sc.k !== "tour") return null;
  const per = sc.t / G.cats.length;
  const i = Math.min(G.cats.length - 1, Math.floor(st.sceneT / per));
  const local = (st.sceneT - i * per) / per;
  // 카드는 묶음이 바뀔 때마다 들고 난다
  const a = Math.min(1, local / .2) * Math.min(1, (1 - local) / .2);
  // 조명은 장면이 시작할 때 한 번 내려앉고 끝날 때 한 번 올라온다
  const spot = Math.min(1, st.sceneT / .9) * Math.min(1, (sc.t - st.sceneT) / .9);
  return { i, local, a: Math.max(0, a), spot: Math.max(0, spot) };
}

function drawLiveEdges(px, py) {
  const mix = flowMix();
  if (mix <= 0.01) return;
  const zk = Math.min(2.4, Math.max(.7, cam.z));
  const dim = st.match ? .3 : 1;
  // 밝기 세 칸으로 나눠 한 번에 긋는다. 한 줄씩 그으면 그래픽 가속이 없는 곳에서 버틴다.
  const bins = [[], [], []];
  for (let i = 0; i < E; i++) {
    const a = eAct[i];
    if (a < .05) continue;
    bins[a < .34 ? 0 : a < .7 ? 1 : 2].push(i);
  }
  ctx.save();
  ctx.lineCap = "round";
  for (let b = 0; b < 3; b++) {
    if (!bins[b].length) continue;
    ctx.beginPath();
    for (const i of bins[b]) {
      const e = G.edges[i];
      ctx.moveTo(sx(px(e[0])), sy(py(e[0])));
      ctx.lineTo(sx(px(e[1])), sy(py(e[1])));
    }
    const k = [0.22, 0.5, 0.86][b];
    ctx.strokeStyle = "#7fb0ff";
    ctx.globalAlpha = k * 0.34 * mix * dim;
    ctx.lineWidth = 3.4 * zk;
    ctx.stroke();
    ctx.strokeStyle = "#e4efff";
    ctx.globalAlpha = k * mix * dim;
    ctx.lineWidth = 1.25 * zk;
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

const parts = [];
function spawnParticle() {
  if (!ROUTES.length) return;
  const u = Math.random();
  let r = ROUTES[ROUTES.length - 1];
  for (const c of ROUTES) if (u <= c.cum) { r = c; break; }
  parts.push({ r, t: 0, sp: .16 + Math.random() * .17, hit: 0 });
}

function pointOf(step) {
  if (step.k === "s") return [srcX(step.i), srcY(step.i)];
  if (step.k === "n") return [nodeX(step.i), nodeY(step.i)];
  if (step.k === "c") return [campX(step.i), campY(step.i)];
  return [0, 0];
}

/* ================================================================== *
 * 상태
 * ================================================================== */
const st = {
  t: 0, scene: 0, sceneT: 0,
  playing: true, intro: CFG.autoplay,
  layers: { src: true, web: true, pay: true, flow: true },
  prog: { settle: 0, size: 0, tour: 0, links: 0, src: 0, pay: 0, bridge: 0, prune: 0, flow: 0, shuffle: 0 },
  dayProg: 0, dayHold: 0,
  hover: -1, sel: null, query: "", match: null, frozen: false, load: .016,
  flashes: [],
};
if (!CFG.autoplay) {
  st.intro = false;
  for (const k in st.prog) st.prog[k] = 1;
  st.dayProg = 1;
  st.scene = SCENES.length - 1;
}
if (P.has("stage")) {
  const k = Math.max(0, Math.min(SCENES.length - 1, Number(P.get("stage")) || 0));
  st.intro = true; st.scene = k; st.sceneT = SCENES[k].t * 0.5; st.frozen = true;
  const keys = ["settle", "size", "tour", "links", "src", "pay", "bridge", "prune", "flow"];
  keys.forEach((n, i) => st.prog[n] = k >= i + 1 ? 1 : 0);
  if (k === SCENES.length - 1) { st.prog.flow = 1; st.prog.shuffle = 1; st.dayProg = 1; }
}

/* 하루씩 쌓아 온 기록. 흐름 장면에서 1년을 이 초 만에 지나간다. */
const TL = G.timeline || [];
const TL_SEC = 26;
const TOUR_Z = 1.75;   // 묶음 소개 내내 쓰는 배율. 중간에 바꾸지 않는다
function tlIndex() {
  if (!TL.length) return -1;
  return Math.min(TL.length - 1, Math.floor(st.dayProg * (TL.length - 1) + 1e-9));
}
function tlDate(d) { return d.slice(0, 4) + "." + d.slice(4, 6) + "." + d.slice(6, 8); }

const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const lerp = (a, b, k) => a + (b - a) * k;

/* ================================================================== *
 * 노드가 지금 어디에 있는가
 * 먼지 자리 → 제자리 → 정리 뒤 자리 → 흐름 장면 자리, 넷을 이어 붙인다.
 * 프레임마다 노드 1,151개를 훑으므로 부드럽기 값은 한 번만 구해 둔다.
 * ================================================================== */
const EZ = { settle: 0, prune: 0, shuffle: 0 };
function syncEase() {
  EZ.settle = ease(st.prog.settle);
  EZ.prune = ease(st.prog.prune);
  EZ.shuffle = ease(st.prog.shuffle);
}
function nodeX(i) {
  const n = G.nodes[i];
  return lerp(lerp(lerp(nx0[i], n.x, EZ.settle), n.x2, EZ.prune), n.x3, EZ.shuffle);
}
function nodeY(i) {
  const n = G.nodes[i];
  return lerp(lerp(lerp(ny0[i], n.y, EZ.settle), n.y2, EZ.prune), n.y3, EZ.shuffle);
}
/* 결제 캠페인도 흐름 장면에서 다리 페이지를 따라 함께 흩어진다 */
function campX(i) { const c = G.camps[i]; return lerp(c.x, c.x3, EZ.shuffle); }
function campY(i) { const c = G.camps[i]; return lerp(c.y, c.y3, EZ.shuffle); }

/* ================================================================== *
 * 그리기
 * ================================================================== */
/* 간선 4,580개를 프레임마다 다시 그리면 그래픽 가속이 없는 환경에서 버틴다.
   화면이 그대로일 때는 미리 그려 둔 그림을 덮어 쓴다. */
const off = document.createElement("canvas");
const octx = off.getContext("2d");
let offKey = "";

function edgeLayer(posX, posY, p) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const key = [
    Math.round(cam.x * 400), Math.round(cam.y * 400), Math.round(cam.z * 200),
    W, H, dpr,
    st.layers.web ? 1 : 0, st.layers.pay ? 1 : 0,
    Math.round(p.settle * 60), Math.round(webEdgeMix() * 60),
    Math.round(p.bridge * 24), Math.round(flowMix() * 24),
    Math.round(p.prune * 90), Math.round(EZ.shuffle * 90), Math.round(st.dayProg * 400),
    st.match ? st.match.v : 0,
  ].join(",");
  if (key === offKey) return;
  offKey = key;
  if (off.width !== Math.round(W * dpr) || off.height !== Math.round(H * dpr)) {
    off.width = Math.round(W * dpr); off.height = Math.round(H * dpr);
  }
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, W, H);
  withCtx(octx, () => {
    const wm = webEdgeMix();
    if (st.layers.web && wm > 0) drawEdges(posX, posY, wm);
    if (st.layers.pay && p.bridge > 0) drawBridges(posX, posY, ease(p.bridge));
  });
}

/* 그리는 대상을 잠깐 바꿔치기한다. 그리기 함수는 ctx 하나만 본다. */
function withCtx(target, fn) { ctx = target; try { fn(); } finally { ctx = mainCtx; } }

function draw(dt) {
  clearLabels();
  drawSky();
  const p = st.prog;
  syncEase();

  // 정리 장면에서 남는 페이지는 새 자리로, 흐름 장면에서는 한 번 더 흩어진 자리로 미끄러진다
  const posX = nodeX, posY = nodeY;

  edgeLayer(posX, posY, p);
  if (off.width) mainCtx.drawImage(off, 0, 0, W, H);
  if (st.layers.web) drawLiveEdges(posX, posY);
  // 유입원이 공전하므로 바깥에서 들어오는 선은 미리 그려 둘 수 없다. 매 장면 새로 그린다.
  if (st.layers.src && p.src > 0) drawSrcEdges(posX, posY, ease(p.src));
  if (st.layers.pay && p.pay > 0) drawCore(ease(p.pay));
  if (st.layers.web) drawNodes(posX, posY);
  if (st.layers.src && p.src > 0) drawSrcs(ease(p.src));
  const secK = ease((p.size - .4) / .6) * (1 - EZ.shuffle);
  if (st.layers.web && p.size > .4 && secK > .01) drawSectorLabels(secK);
  if (st.layers.flow && p.flow > 0) drawParticles(dt, posX, posY);
  drawFlashes(dt);
  drawHud();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, W * .4, H);
  g.addColorStop(0, "#0c1330"); g.addColorStop(.5, "#070c1d"); g.addColorStop(1, "#04060d");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const cxp = sx(0), cyp = sy(0);
  const neb = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, RM() * cam.z * 1.5);
  neb.addColorStop(0, "rgba(86,120,255,.17)");
  neb.addColorStop(.55, "rgba(70,90,200,.05)");
  neb.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = neb; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#dce6ff";
  for (const s of stars) {
    ctx.globalAlpha = s.a * (.6 + .4 * Math.sin(st.t * s.sp + s.tw));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function dimmed(i) {
  return st.match && !st.match.nodes.has(i);
}

function drawEdges(px, py, k) {
  ctx.save();
  ctx.lineCap = "round";
  for (let b = 0; b < 4; b++) {
    const list = EBUCKET[b];
    if (!list.length) continue;
    const pm = pruneMix();
    const dying = [];
    ctx.beginPath();
    for (const e of list) {
      const a = e[0], c = e[1];
      if (pm > .01 && (!G.nodes[a].k || !G.nodes[c].k)) {
        if (pm < .99) dying.push(e);
        continue;
      }
      ctx.moveTo(sx(px(a)), sy(py(a)));
      ctx.lineTo(sx(px(c)), sy(py(c)));
    }
    const zk = Math.min(2.4, Math.max(.7, cam.z));
    // 흐름 연출이 켜지면 바탕의 그물을 가라앉힌다. 지나가는 자리만 drawLiveEdges가 밝힌다.
    const dim = (st.match ? .22 : 1) * lerp(1, .20, flowMix());
    ctx.strokeStyle = "#6f93ff";
    ctx.globalAlpha = EALPHA[b] * k * dim * .45;
    ctx.lineWidth = EWIDTH[b] * zk * 2.4;
    ctx.stroke();
    ctx.strokeStyle = "#a9c4ff";
    ctx.globalAlpha = EALPHA[b] * k * dim;
    ctx.lineWidth = EWIDTH[b] * zk;
    ctx.stroke();

    if (dying.length) {
      ctx.beginPath();
      for (const e of dying) {
        ctx.moveTo(sx(px(e[0])), sy(py(e[0])));
        ctx.lineTo(sx(px(e[1])), sy(py(e[1])));
      }
      ctx.strokeStyle = "#6f93ff";
      ctx.globalAlpha = EALPHA[b] * k * dim * .45 * (1 - pm);
      ctx.lineWidth = EWIDTH[b] * zk * 2.4;
      ctx.stroke();
      ctx.strokeStyle = "#a9c4ff";
      ctx.globalAlpha = EALPHA[b] * k * dim * (1 - pm);
      ctx.lineWidth = EWIDTH[b] * zk;
      ctx.stroke();
    }
  }
  // 검색으로 고른 페이지에 직접 붙은 연결만 밝게. 이웃의 이웃까지 그리면 실타래가 된다.
  if (st.match) {
    ctx.beginPath();
    let n = 0;
    for (const e of G.edges) {
      if (!st.match.seed.has(e[0]) && !st.match.seed.has(e[1])) continue;
      ctx.moveTo(sx(px(e[0])), sy(py(e[0])));
      ctx.lineTo(sx(px(e[1])), sy(py(e[1])));
      if (++n > 900) break;
    }
    ctx.globalAlpha = .34 * k; ctx.strokeStyle = "#cfe0ff"; ctx.lineWidth = .9;
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* 채널 색으로 미리 묶어 둔다. 유입원이 공전해 매 장면 다시 그리므로 묶음은 한 번만 만든다. */
const SRC_BY_CHAN = (() => {
  const m = new Map();
  for (const [si, ni, v] of G.srcEdges) {
    const c = chanColor(G.srcs[si].ch);
    if (!m.has(c)) m.set(c, []);
    m.get(c).push([si, ni, v]);
  }
  return m;
})();

function drawSrcEdges(px, py, k) {
  ctx.save();
  for (const [col, list] of SRC_BY_CHAN) {
    ctx.beginPath();
    for (const [si, ni, v] of list) {
      const x1 = sx(srcX(si)), y1 = sy(srcY(si)), x2 = sx(px(ni)), y2 = sy(py(ni));
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const cxp = sx(0), cyp = sy(0);
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(mx + (cxp - mx) * .18, my + (cyp - my) * .18, x2, y2);
    }
    ctx.globalAlpha = .17 * k * (st.match ? .2 : 1);
    ctx.strokeStyle = col; ctx.lineWidth = 1.1 * Math.min(2, Math.max(.8, cam.z));
    ctx.stroke();
  }
  // 광고에서 결제로 바로 가는 길은 추정이라 점선으로 구분한다
  ctx.setLineDash([5, 7]);
  ctx.beginPath();
  for (const [si, ci, v] of G.adEdges) {
    const gx = srcX(si), gy = srcY(si);
    ctx.moveTo(sx(gx), sy(gy));
    ctx.quadraticCurveTo(sx(gx * .35), sy(gy * .35), sx(campX(ci)), sy(campY(ci)));
  }
  ctx.globalAlpha = .11 * k * (st.match ? .16 : 1);
  ctx.strokeStyle = "#ffd08a"; ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBridges(px, py, k) {
  // 두 도메인을 잇는 다리. 이 시연의 중심이라 다른 선보다 굵고 밝게 그린다.
  const zk = Math.min(2, Math.max(.8, cam.z));
  ctx.save();
  ctx.lineCap = "round";
  ctx.beginPath();
  for (const [ni, ci, v] of G.campEdges) {
    ctx.moveTo(sx(px(ni)), sy(py(ni)));
    ctx.lineTo(sx(campX(ci)), sy(campY(ci)));
  }
  ctx.globalAlpha = .30 * k;
  ctx.strokeStyle = "#ffb454";
  ctx.lineWidth = 7 * zk;
  ctx.stroke();

  ctx.globalAlpha = .95 * k;
  ctx.strokeStyle = "#ffe6b8";
  ctx.lineWidth = 2.2 * zk;
  ctx.shadowColor = "#ffb454"; ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawCore(k) {
  const cxp = sx(0), cyp = sy(0), rr = RM() * cam.z;
  const ex = RX * cam.z, ey = RY * cam.z;
  ctx.save();
  ctx.globalAlpha = k;

  // 결제 층이 놓인 자리를 옅은 원반과 테두리로 표시한다
  const disc = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, rr * .36);
  disc.addColorStop(0, "rgba(255,180,84,.17)");
  disc.addColorStop(.6, "rgba(255,150,84,.05)");
  disc.addColorStop(1, "rgba(0,0,0,0)");
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cxp, cyp, ex * .36, ey * .36, 0, 0, 6.2832);
  ctx.clip(); ctx.fillStyle = disc; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  ctx.setLineDash([3, 9]);
  ctx.strokeStyle = "rgba(255,196,107,.42)";
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(cxp, cyp, ex * .355, ey * .355, 0, 0, 6.2832); ctx.stroke();
  ctx.setLineDash([]);

  // 퍼널 네 겹
  const fmax = G.funnel[0].v || 1;
  G.funnel.forEach((f, i) => {
    const rad = rr * (.145 - i * .031);
    ctx.beginPath(); ctx.arc(cxp, cyp, Math.max(2, rad), 0, 6.2832);
    ctx.strokeStyle = `rgba(255,${200 - i * 22},${130 - i * 18},${.30 + i * .16})`;
    ctx.lineWidth = Math.max(1, 2.2 - i * .3);
    ctx.stroke();
  });
  const pulse = .55 + .45 * Math.sin(st.t * 1.7);
  ctx.fillStyle = `rgba(255,214,150,${.55 + .35 * pulse})`;
  ctx.shadowColor = "#ffcb7a"; ctx.shadowBlur = 22 + 14 * pulse;
  ctx.beginPath(); ctx.arc(cxp, cyp, Math.max(2.5, rr * .020), 0, 6.2832); ctx.fill();
  ctx.shadowBlur = 0;

  // 캠페인 결제 노드. 콘텐츠 노드와 헷갈리지 않도록 가운데를 비운 고리로 그린다
  for (let ci = 0; ci < G.camps.length; ci++) {
    const c = G.camps[ci];
    const x = sx(campX(ci)), y = sy(campY(ci));
    const rad = Math.max(3, (3.4 + Math.sqrt(c.rev / maxCamp) * 13) * Math.min(2, Math.max(.55, cam.z)));
    const on = !st.match || st.match.camps.has(c.n);
    const col = c.always ? "#9FB4FF" : "#FFD166";
    ctx.globalAlpha = k * (on ? 1 : .18);
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.4, rad * .38);
    ctx.shadowColor = col; ctx.shadowBlur = 13;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(6,9,20,.85)";
    ctx.beginPath(); ctx.arc(x, y, Math.max(1, rad * .45), 0, 6.2832); ctx.fill();
  }

  // 결제 층이라는 것을 화면에 적어 둔다
  ctx.globalAlpha = k * .8;
  ctx.font = `600 ${Math.max(13, 17 * Math.min(1.4, cam.z))}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffc46b";
  ctx.fillText("결제 층  online.mrm.or.kr", cxp, cyp + ey * .355 + 30);
  ctx.textAlign = "left";
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawNodes(px, py) {
  const zoomK = Math.min(2.2, Math.max(.5, cam.z));
  const grow = ease(st.prog.size);
  ctx.save();
  for (let c = 0; c < CATC.length; c++) {
    ctx.beginPath();
    let any = false;
    for (let i = 0; i < N; i++) {
      const n = G.nodes[i];
      if (n.c !== c) continue;
      if (dimmed(i)) continue;
      let r = Math.max(1.1, lerp(1.7, nodeR[i], grow) * zoomK);
      if (!n.k && pruneMix() > .01) {
        r *= 1 - pruneMix();
        if (r < .3) continue;
      }
      const x = sx(px(i)), y = sy(py(i));
      if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;
      ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832);
      any = true;
    }
    if (!any) continue;
    // 흐름이 흐르는 동안에는 바탕의 점을 가라앉힌다
    const tn = tourNow();
    const spot = tn ? (tn.i === c ? 1 : lerp(1, .09, tn.spot)) : 1;
    ctx.globalAlpha = lerp(.42, .88, ease(st.prog.settle)) * lerp(1, .52, flowMix()) * spot;
    ctx.fillStyle = st.prog.settle < .12 ? "#8fa3d8" : CATC[c];
    ctx.fill();
  }

  // 방금 흐름이 지나간 페이지만 다시 밝아진다. 후광과 알맹이를 밝기 세 칸으로 묶어 그린다.
  const fm = flowMix();
  if (fm > .01) {
    const hot = [[], [], []];
    for (let i = 0; i < N; i++) {
      const a = nAct[i];
      if (a < .05 || dimmed(i)) continue;
      hot[a < .34 ? 0 : a < .7 ? 1 : 2].push(i);
    }
    for (let b = 0; b < 3; b++) {
      if (!hot[b].length) continue;
      const a = [.16, .4, .74][b];
      for (let pass = 0; pass < 2; pass++) {
        ctx.beginPath();
        for (const i of hot[b]) {
          const x = sx(px(i)), y = sy(py(i));
          if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
          const r = Math.max(1.4, lerp(1.7, nodeR[i], grow) * zoomK) * (pass ? 1 + a * .28 : 1.75);
          ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832);
        }
        ctx.globalAlpha = (pass ? a : a * .11) * fm;
        ctx.fillStyle = pass ? "#eaf2ff" : "#7fb0ff";
        ctx.fill();
      }
    }
  }
  // 흐려진 페이지
  if (st.match) {
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      if (!dimmed(i)) continue;
      const r = Math.max(.8, lerp(1.7, nodeR[i], grow) * zoomK * .55);
      ctx.moveTo(sx(px(i)) + r, sy(py(i))); ctx.arc(sx(px(i)), sy(py(i)), r, 0, 6.2832);
    }
    ctx.globalAlpha = .07; ctx.fillStyle = "#7E8CB0"; ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 큰 페이지에만 이름을 붙인다
  if (st.prog.size > .5) {
    const tl = tourNow();
    const lab = [];
    for (let i = 0; i < N; i++) {
      if (dimmed(i)) continue;
      // 소개 중에는 지금 비추는 묶음만 이름을 붙인다
      if (tl && tl.spot > .35 && G.nodes[i].c !== tl.i) continue;
      const r = nodeR[i] * zoomK;
      if (r < (st.match ? 4.5 : tl ? 3.2 : 7)) continue;
      lab.push(i);
    }
    lab.sort((a, b) => nodeR[b] - nodeR[a]);
    ctx.save();
    ctx.globalAlpha = ease((st.prog.size - .5) / .5);
    // 이름표가 한쪽에 몰리지 않도록 서로 일정 거리를 두고 고른다
    const placed = [];
    const MIN_GAP = Math.min(W, H) * 0.075;
    let shown = 0;
    for (const i of lab) {
      if (shown >= 14) break;
      const n = G.nodes[i];
      const x = sx(px(i)), y = sy(py(i));
      if (x < 60 || x > W - 60 || y < 70 || y > H - 90) continue;
      if (placed.some(q => Math.hypot(q[0] - x, q[1] - y) < MIN_GAP)) continue;
      const r = Math.max(1.1, nodeR[i] * zoomK);
      if (label(shorten(n.t, 18), x, y - r - 7, CATC[n.c], 15)) {
        placed.push([x, y]);
        shown++;
      }
    }
    ctx.restore();
  }

  if (st.hover >= 0) {
    const n = G.nodes[st.hover];
    const x = sx(px(st.hover)), y = sy(py(st.hover));
    const r = Math.max(3, nodeR[st.hover] * zoomK);
    ctx.save();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y, r + 5, 0, 6.2832); ctx.stroke();
    label(shorten(n.t, 26), x, y - r - 12, "#ffffff", 17, true);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* 긴 제목은 잘라 쓴다. 화면을 가로지르는 이름표가 지도를 덮는다. */
function shorten(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

/* 이름표가 서로 겹치면 뒤엣것을 건너뛴다. 프레임마다 자리를 새로 잡는다. */
let labelBoxes = [];
function clearLabels() { labelBoxes = []; }
function label(text, x, y, color, px, force) {
  ctx.font = `600 ${px}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
  const w = ctx.measureText(text).width;
  const box = [x - w / 2 - 6, y - px, w + 12, px + 7];
  // 화면 밖으로 나가면 안으로 끌어당긴다. 가장자리 유입원 이름이 잘리지 않게.
  box[0] = Math.max(6, Math.min(W - box[2] - 6, box[0]));
  box[1] = Math.max(6, Math.min(H - box[3] - 6, box[1]));
  x = box[0] + box[2] / 2;
  y = box[1] + px;
  if (!force) {
    for (const b of labelBoxes) {
      if (box[0] < b[0] + b[2] && box[0] + box[2] > b[0] &&
          box[1] < b[1] + b[3] && box[1] + box[3] > b[1]) return false;
    }
  }
  labelBoxes.push(box);
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "rgba(4,6,13,.66)";
  ctx.fillRect(box[0], box[1], box[2], box[3]);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.textAlign = "left";
  return true;
}

/* 유입원 그리는 차례. 큰 유입원이 먼저 이름 자리를 잡는다. */
const SRC_ORDER = G.srcs.map((s, i) => i).sort((a, b) => G.srcs[b].v - G.srcs[a].v);

function drawSrcs(k) {
  ctx.save();
  ctx.globalAlpha = k;
  const zoomK = Math.min(1.8, Math.max(.6, cam.z));

  // 공전 궤도를 옅은 점선으로 깔아 둔다. 유입원이 도는 자리가 눈에 잡힌다.
  ctx.setLineDash([2, 12]);
  ctx.strokeStyle = "rgba(150,175,235,.22)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(sx(0), sy(0), RX * cam.z * ORBIT_R, RY * cam.z * ORBIT_R, 0, 0, 6.2832);
  ctx.stroke();
  ctx.setLineDash([]);

  for (const i of SRC_ORDER) {
    const s = G.srcs[i];
    const gx = srcX(i), gy = srcY(i);
    const x = sx(gx), y = sy(gy);
    const r = (5 + Math.sqrt(s.v / maxSrc) * 17) * zoomK;
    const col = chanColor(s.ch);
    // 도는 방향 뒤쪽으로 옅은 꼬리를 남긴다
    const tail = ctx.createLinearGradient(
      x + Math.sin(ORBIT[i].a + st.t * ORBIT[i].w) * r * 5,
      y - Math.cos(ORBIT[i].a + st.t * ORBIT[i].w) * r * 5, x, y);
    tail.addColorStop(0, "rgba(0,0,0,0)");
    tail.addColorStop(1, col);
    ctx.globalAlpha = k * .16;
    ctx.strokeStyle = tail; ctx.lineWidth = r * 1.2; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x + Math.sin(ORBIT[i].a + st.t * ORBIT[i].w) * r * 5,
               y - Math.cos(ORBIT[i].a + st.t * ORBIT[i].w) * r * 5);
    ctx.lineTo(x, y);
    ctx.stroke();

    ctx.globalAlpha = k;
    ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
    // 이름이 서로 겹치면 바깥으로 조금 밀어 다시 시도한다. 공전 중에 이름이 사라지지 않게.
    const out = Math.hypot(gx, gy) || 1;
    for (const push of [0, 26, 54, 84]) {
      if (label(s.n, x + (gx / out) * (r + 44 + push),
                y + (gy / out) * (r + 26 + push) + 5, "#e6edff", 17)) break;
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* 부채꼴마다 무슨 묶음인지 바깥 테두리에 적어 둔다. 구석의 범례보다 빨리 읽힌다. */
function drawSectorLabels(k) {
  if (!G.sectors) return;
  const px = CFG.ratio === "9:16" ? 24 : 22;
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const tl = tourNow();
  for (const s of G.sectors) {
    if (tl && tl.spot > .35 && s.c !== tl.i) continue;
    if (s.w < 0.22 && !(tl && s.c === tl.i)) continue;   // 너무 좁은 부채꼴은 적을 자리가 없다
    const x = sx(Math.cos(s.a) * 1.035), y = sy(Math.sin(s.a) * 1.035);
    if (x < 40 || x > W - 40 || y < 40 || y > H - 40) continue;
    ctx.font = `700 ${px}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    const w = ctx.measureText(G.cats[s.c].label).width;
    // 다른 이름표와 겹치면 건너뛴다. 좁은 화면에서 두 묶음 이름이 붙어 읽혔다.
    const box = [x - w / 2 - 10, y - px * .8, w + 20, px * 1.6];
    if (labelBoxes.some(b => box[0] < b[0] + b[2] && box[0] + box[2] > b[0] &&
                             box[1] < b[1] + b[3] && box[1] + box[3] > b[1])) continue;
    labelBoxes.push(box);
    // 이름표 상자 대신 옅은 후광만 깐다. 노드 이름표와 결이 달라 보인다.
    const g = ctx.createRadialGradient(x, y, 0, x, y, w * .9);
    g.addColorStop(0, "rgba(4,6,13,.78)");
    g.addColorStop(1, "rgba(4,6,13,0)");
    ctx.globalAlpha = k;
    ctx.fillStyle = g;
    ctx.fillRect(x - w, y - px, w * 2, px * 2);
    ctx.globalAlpha = k * .78;
    ctx.fillStyle = G.cats[s.c].color;
    ctx.fillText(G.cats[s.c].label, x, y);
  }
  ctx.restore();
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.globalAlpha = 1;
}

function drawParticles(dt, px, py) {
  const want = Math.round(150 * ease(st.prog.flow) * qual());
  while (parts.length < want) spawnParticle();
  ctx.save();
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += p.sp * dt;
    const segs = p.r.path.length - 1;
    if (p.t >= segs) {
      st.flashes.push({ x: 0, y: 0, t: 0, est: p.r.est });
      parts.splice(i, 1);
      continue;
    }
    const s = Math.floor(p.t), f = p.t - s;
    const A = pointOf(p.r.path[s]), B = pointOf(p.r.path[s + 1]);
    const ax = p.r.path[s].k === "n" ? px(p.r.path[s].i) : A[0];
    const ay = p.r.path[s].k === "n" ? py(p.r.path[s].i) : A[1];
    const bx = p.r.path[s + 1].k === "n" ? px(p.r.path[s + 1].i) : B[0];
    const by = p.r.path[s + 1].k === "n" ? py(p.r.path[s + 1].i) : B[1];
    const x = sx(lerp(ax, bx, f)), y = sy(lerp(ay, by, f));
    const a = Math.min(1, Math.min(p.t, segs - p.t) * 2.2);
    ctx.globalAlpha = a * (p.r.est ? .5 : .92);
    ctx.fillStyle = p.r.est ? "#ffd08a" : "#ffffff";
    ctx.shadowColor = p.r.est ? "#ffb454" : "#bcd4ff";
    ctx.shadowBlur = 9;
    ctx.beginPath(); ctx.arc(x, y, p.r.est ? 1.7 : 2.3, 0, 6.2832); ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawFlashes(dt) {
  const cxp = sx(0), cyp = sy(0);
  ctx.save();
  for (let i = st.flashes.length - 1; i >= 0; i--) {
    const f = st.flashes[i];
    f.t += dt;
    if (f.t > .85) { st.flashes.splice(i, 1); continue; }
    const k = f.t / .85;
    ctx.globalAlpha = (1 - k) * .7;
    ctx.strokeStyle = f.est ? "#ffd08a" : "#ffffff";
    ctx.lineWidth = 2 * (1 - k);
    ctx.beginPath(); ctx.arc(cxp, cyp, 6 + k * 46 * cam.z, 0, 6.2832); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ================================================================== *
 * 화면 위 글자
 * ================================================================== */
function drawHud() {
  const v = CFG.ratio === "9:16";
  const pad = v ? 46 : 56;
  const titlePx = v ? 38 : 34;
  ctx.save();
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.font = `700 ${titlePx}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
  ctx.fillStyle = "#e9f0ff";
  ctx.fillText("웹 구조 지도", pad, pad + titlePx * .8);
  ctx.font = `500 ${titlePx * .55}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
  ctx.fillStyle = "#7f8db3";
  const pm = pruneMix();
  const pgs = Math.round(lerp(G.meta.pages, G.meta.pages_kept || G.meta.pages, pm));
  const edg = Math.round(lerp(G.meta.edges, G.meta.edges_kept || G.meta.edges, pm));
  ctx.fillText(`페이지 ${pgs.toLocaleString("ko-KR")}개, 이동 ${edg.toLocaleString("ko-KR")}갈래, ${G.meta.range}`,
               pad, pad + titlePx * .8 + titlePx * .95);

  // 연출 자막
  const cap = st.intro ? (SCENES[st.scene] || {}).cap : "";
  if (cap) {
    const px = v ? 32 : 30;
    ctx.font = `600 ${px}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    // 마지막 자막은 연출이 끝나는 3.5초에 맞춰 사라진다
    const outAt = st.scene === SCENES.length - 1 ? 3.5 : SCENES[st.scene].t;
    const a = Math.min(1, st.sceneT / .5) * Math.min(1, (outAt - st.sceneT) / .6);
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = "center";
    const w = ctx.measureText(cap).width;
    const cy = H - (v ? 250 : 150);
    ctx.fillStyle = "rgba(9,13,26,.72)";
    roundRect(W / 2 - w / 2 - 26, cy - px, w + 52, px * 1.9, px);
    ctx.fill();
    ctx.fillStyle = "#dfe8ff";
    ctx.fillText(cap, W / 2, cy + px * .38);
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  // 묶음 소개 카드
  const tn = tourNow();
  if (tn) {
    const cat = G.cats[tn.i];
    const px = v ? 30 : 27;
    const cw = Math.min(W - pad * 2, v ? W - pad * 2 : 640);
    const ch = px * 5.1;
    const cx = W / 2 - cw / 2, cy = H - (v ? 300 : 190) - ch;
    ctx.globalAlpha = tn.a;
    ctx.fillStyle = "rgba(9,13,26,.86)";
    roundRect(cx, cy, cw, ch, 16); ctx.fill();
    ctx.strokeStyle = "rgba(150,170,220,.18)"; ctx.lineWidth = 1;
    roundRect(cx, cy, cw, ch, 16); ctx.stroke();

    let ty = cy + px * 1.35;
    ctx.beginPath(); ctx.arc(cx + px * .95, ty - px * .3, px * .3, 0, 6.2832);
    ctx.fillStyle = cat.color; ctx.fill();

    ctx.textAlign = "left";
    ctx.font = `700 ${px}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    ctx.fillStyle = "#eaf0ff";
    ctx.fillText(cat.label, cx + px * 1.55, ty);

    ctx.textAlign = "right";
    ctx.font = `700 ${px * .95}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    ctx.fillStyle = cat.color;
    ctx.fillText(cat.n.toLocaleString("ko-KR") + "개", cx + cw - px * .9, ty);

    ctx.textAlign = "left";
    ty += px * 1.42;
    ctx.font = `500 ${px * .78}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    ctx.fillStyle = "#c3cee8";
    ctx.fillText(cat.desc || "", cx + px * .95, ty);

    if (cat.top) {
      ty += px * 1.3;
      ctx.font = `500 ${px * .68}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
      ctx.fillStyle = "#7f8db3";
      ctx.fillText("가장 많이 읽힌 곳", cx + px * .95, ty);
      const lw = ctx.measureText("가장 많이 읽힌 곳").width;
      ctx.fillStyle = "#dfe8ff";
      ctx.fillText(shorten(cat.top, v ? 20 : 30), cx + px * .95 + lw + px * .6, ty);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  drawLegend(pad, v);

  // 결제 층 요약. 흐름 장면에서는 날짜를 넘기며 숫자가 함께 쌓인다.
  const counting = st.prog.flow > .001 && TL.length > 0;
  if (counting) {
    const px = v ? 24 : 22;
    const now = TL[tlIndex()];
    ctx.globalAlpha = Math.min(1, st.prog.flow / .25);
    ctx.textAlign = "right";
    let y = pad + px;

    if (now) {
      // 지나가는 날짜
      const dpx = v ? 40 : 36;
      ctx.font = `800 ${dpx}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
      ctx.fillStyle = "#ffffff";
      ctx.fillText(tlDate(now.d), W - pad, y + dpx * .55);
      y += dpx * 1.25;

      // 지나온 만큼 채워지는 막대
      const bw = v ? 220 : 250, bh = 4;
      const bx = W - pad - bw, by = y - px * .5;
      ctx.fillStyle = "rgba(150,170,220,.20)";
      roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
      ctx.fillStyle = "#ffc46b";
      roundRect(bx, by, Math.max(bh, bw * st.dayProg), bh, bh / 2); ctx.fill();
      y += px * .75;
    }

    ctx.font = `500 ${px}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    ctx.fillStyle = "#ffc46b";
    ctx.fillText("후원 퍼널", W - pad, y);
    ctx.fillStyle = "#8b97b8";
    G.funnel.forEach((f, i) => {
      y += px * 1.42;
      const val = now ? now.f[i] : f.v;
      ctx.fillText(`${f.l}  ${val.toLocaleString("ko-KR")}`, W - pad, y);
    });

    // 모금액
    y += px * 1.7;
    ctx.font = `700 ${px * 1.18}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    ctx.fillStyle = "#ffd479";
    const rev = now ? now.v : (TL.length ? TL[TL.length - 1].v : 0);
    ctx.fillText(rev.toLocaleString("ko-KR") + "원", W - pad, y);
    ctx.font = `500 ${px * .8}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    ctx.fillStyle = "#7f8db3";
    ctx.fillText("GA4가 기록한 모금액", W - pad, y + px * 1.1);

    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }

  // 아래쪽 자료 출처
  const px2 = v ? 20 : 19;
  ctx.font = `500 ${px2}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
  ctx.fillStyle = "rgba(140,155,190,.5)";
  ctx.textAlign = "right";
  ctx.fillText("자료 " + G.meta.source + "  점선은 추정 경로", W - pad, H - pad * .7 - 62);
  ctx.textAlign = "left";
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawLegend(pad, v) {
  const px = v ? 22 : 20;
  const gap = px * 1.62;
  let y = H - pad * .7 - gap * (CATC.length - 1) - (v ? 150 : 62);
  ctx.save();
  ctx.font = `500 ${px}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
  ctx.globalAlpha = .85;
  for (let i = 0; i < G.cats.length; i++) {
    ctx.fillStyle = CATC[i];
    ctx.beginPath(); ctx.arc(pad + 7, y - px * .3, 6, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#9fadd0";
    ctx.fillText(G.cats[i].label, pad + 24, y);
    y += gap;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, h / 2, w / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

/* ================================================================== *
 * 진행
 * ================================================================== */
function advance(dt) {
  const tn = tourNow();
  if (tn) {
    // 소개하는 동안 배율은 한 번 당겨 놓고 그대로 둔다.
    // 묶음이 바뀔 때마다 당겼다 놓으면 화면이 출렁여 보기 힘들다.
    const key = G.cats[tn.i].key;
    const sec = (G.sectors || []).find(q => G.cats[q.c].key === key);
    if (sec) {
      cam.tx = Math.cos(sec.a) * .70;
      cam.ty = Math.sin(sec.a) * .70;
    } else {
      const h = G.nodes.find(n => n.c === tn.i);   // 홈은 부채꼴이 없다
      cam.tx = h ? h.x : 0;
      cam.ty = h ? h.y : 0;
    }
    cam.tz = TOUR_Z;
  } else if (st.intro && st.scene === KIDX.tour + 1) {
    cam.tx = 0; cam.ty = 0; cam.tz = 1;
  }
  // 소개 중에는 옆으로 천천히 미끄러진다
  const ck = Math.min(1, dt * (tn ? 1.7 : 4));
  cam.x = lerp(cam.x, cam.tx, ck);
  cam.y = lerp(cam.y, cam.ty, ck);
  cam.z = lerp(cam.z, cam.tz, Math.min(1, dt * 4));

  if (st.frozen) return;   // ?stage= 로 한 단계를 세워 둔 상태
  if (!st.intro) {
    for (const k in st.prog) st.prog[k] = Math.min(1, st.prog[k] + dt * .8);
    // 자막이 걷힌 뒤에도 날짜는 계속 넘어간다
    if (TL.length) { st.dayProg = Math.min(1, st.dayProg + dt / TL_SEC); dayEnd(dt); }
    return;
  }
  st.sceneT += dt;
  const sc = SCENES[st.scene];
  const key = { settle: "settle", size: "size", tour: "tour", links: "links", src: "src", pay: "pay", bridge: "bridge", prune: "prune", flow: "flow" }[sc.k];
  if (key) st.prog[key] = Math.min(1, st.prog[key] + dt / Math.max(.8, sc.t * .72));
  // 마지막 장면에서 날짜가 하루씩 넘어간다
  if (sc.k === "flow") {
    // 구매 흐름을 쫓기 시작하면 자리를 다시 섞는다. 결제로 이어지는 페이지가
    // 한 부채꼴에 몰려 있으면 구슬이 늘 같은 방향에서만 날아온다.
    st.prog.shuffle = Math.min(1, st.prog.shuffle + dt / 3.2);
    st.dayProg = Math.min(1, st.dayProg + dt / TL_SEC);
    dayEnd(dt);
  }
  // 지나온 단계는 확실히 채운다
  const orderKeys = ["dust", "settle", "size", "tour", "links", "src", "pay", "bridge", "prune", "flow"];
  for (let i = 1; i <= st.scene; i++) st.prog[orderKeys[i]] = 1;
  if (st.sceneT >= sc.t && st.scene < SCENES.length - 1) { st.scene++; st.sceneT = 0; }
  if (st.scene === SCENES.length - 1) st.intro = st.sceneT < 3.5 ? true : false;
}

/* 마지막 날에 닿으면 총계를 잠깐 보여 준 뒤 첫날로 돌아가 다시 흐른다. */
const DAY_HOLD = 3.0;
function dayEnd(dt) {
  if (st.dayProg < 1) { st.dayHold = 0; return; }
  if (!CFG.autoplay) return;            // 검수와 갈무리에서는 마지막 날에 세워 둔다
  st.dayHold += dt;
  if (st.dayHold >= DAY_HOLD) { st.dayProg = 0; st.dayHold = 0; }
}

let prev = performance.now();
function tick(now) {
  const raw = Math.min(.05, (now - prev) / 1000);
  prev = now;
  // 멈춘 동안에는 흐르는 시간을 0으로 준다. 화면은 계속 그려서
  // 마우스를 올리거나 끌어 보는 것은 멈춘 채로도 된다.
  const dt = st.playing ? raw : 0;
  st.t += dt;
  loadWatch(raw);
  advance(dt);
  if (st.layers.web && flowMix() > .01) stepWalkers(dt);
  draw(dt);
  requestAnimationFrame(tick);
}

/* ================================================================== *
 * 조작
 * ================================================================== */
function graphAt(clientX, clientY) {
  const b = cv.getBoundingClientRect();
  const gx = ((clientX - b.left) / b.width) * W;
  const gy = ((clientY - b.top) / b.height) * H;
  return [(gx - W / 2) / (RX * cam.z) + cam.x, (gy - H / 2) / (RY * cam.z) + cam.y, gx, gy];
}

function pick(px, py) {
  let best = -1, bd = 1e9;
  const zoomK = Math.min(2.2, Math.max(.5, cam.z));
  syncEase();
  for (let i = 0; i < N; i++) {
    const d = Math.hypot(sx(nodeX(i)) - px, sy(nodeY(i)) - py);
    const r = Math.max(5, nodeR[i] * zoomK) + 6;
    if (d < r && d < bd) { bd = d; best = i; }
  }
  return best;
}

let drag = null;
cv.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, y: e.clientY, cx: cam.tx, cy: cam.ty, moved: false };
  cv.classList.add("drag");
  cv.setPointerCapture(e.pointerId);
  if (e.pointerType !== "mouse") flashBar(3200);
});
cv.addEventListener("pointermove", e => {
  if (drag) {
    const b = cv.getBoundingClientRect();
    const kx = (W / b.width) / (RX * cam.z), ky = (H / b.height) / (RY * cam.z);
    cam.tx = drag.cx - (e.clientX - drag.x) * kx;
    cam.ty = drag.cy - (e.clientY - drag.y) * ky;
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) drag.moved = true;
    return;
  }
  const [, , px, py] = graphAt(e.clientX, e.clientY);
  st.hover = pick(px, py);
});
cv.addEventListener("pointerup", e => {
  const wasDrag = drag && drag.moved;
  drag = null; cv.classList.remove("drag");
  if (wasDrag) return;
  const [, , px, py] = graphAt(e.clientX, e.clientY);
  const i = pick(px, py);
  if (i >= 0) showPanel(i); else closePanel();
});
cv.addEventListener("pointerleave", () => { st.hover = -1; drag = null; cv.classList.remove("drag"); });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const [gx, gy] = graphAt(e.clientX, e.clientY);
  const f = Math.exp(-e.deltaY * .0016);
  const nz = Math.max(.55, Math.min(9, cam.tz * f));
  cam.tx = gx - (gx - cam.tx) * (cam.tz / nz);
  cam.ty = gy - (gy - cam.ty) * (cam.tz / nz);
  cam.tz = nz;
}, { passive: false });

/* 패널 */
const panel = document.getElementById("panel");
const pbody = document.getElementById("pbody");
function showPanel(i) {
  const n = G.nodes[i];
  st.sel = i;
  const bridge = G.campEdges.find(e => e[0] === i);
  const camp = bridge ? G.camps[bridge[1]] : null;
  const srcs = G.srcEdges.filter(e => e[1] === i)
    .sort((a, b) => b[2] - a[2]).slice(0, 3)
    .map(e => `${G.srcs[e[0]].n} ${e[2].toLocaleString("ko-KR")}`);
  pbody.innerHTML =
    `<h3>${esc(n.t)}</h3><div class="path">${esc(n.p)}</div>` +
    `<dl><dt>분류</dt><dd>${esc(G.cats[n.c].label)}</dd>` +
    `<dt>조회수</dt><dd>${n.pv.toLocaleString("ko-KR")}</dd>` +
    `<dt>세션</dt><dd>${n.s.toLocaleString("ko-KR")}</dd>` +
    `<dt>평균 체류</dt><dd>${n.e}초</dd></dl>` +
    (srcs.length ? `<div style="margin-top:9px;color:var(--dim)">주요 유입<br>${srcs.map(esc).join("<br>")}</div>` : "") +
    (camp ? `<div style="margin-top:9px;color:#ffc46b">결제로 이어짐<br>${esc(camp.n)}<br>후원 ${camp.pu}건, ${camp.rev.toLocaleString("ko-KR")}원</div>` : "");
  panel.classList.add("on");
  cam.tx = nodeX(i); cam.ty = nodeY(i); cam.tz = Math.max(cam.tz, 2.1);
}
function closePanel() { panel.classList.remove("on"); st.sel = null; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
document.getElementById("pclose").onclick = closePanel;

/* 검색 */
const $q = document.getElementById("q");
function runSearch() {
  const q = $q.value.trim().toLowerCase();
  st.query = q;
  if (!q) { st.match = null; offKey = ""; return; }
  const nodes = new Set(), camps = new Set();
  for (let i = 0; i < N; i++) {
    const n = G.nodes[i];
    if (n.t.toLowerCase().includes(q) || n.p.toLowerCase().includes(q)) nodes.add(i);
  }
  for (const c of G.camps) if (c.n.toLowerCase().includes(q)) camps.add(c.n);
  for (const [ni, ci] of G.campEdges) if (camps.has(G.camps[ci].n)) nodes.add(ni);
  // 고른 페이지의 이웃도 함께 밝힌다
  const seed = new Set(nodes);
  for (const [a, b] of G.edges) {
    if (seed.has(a)) nodes.add(b);
    else if (seed.has(b)) nodes.add(a);
  }
  st.match = { nodes, camps, seed, v: (st.match ? st.match.v : 0) + 1 };
}
$q.addEventListener("input", runSearch);

/* 단추 */
const $play = document.getElementById("play");
function setPlaying(v) {
  st.playing = v;
  $play.textContent = v ? "멈춤" : "이어 보기";
  $play.classList.toggle("off", !v);
}
$play.onclick = () => setPlaying(!st.playing);

/* 덱에서 보내는 재생과 일시정지. 판 안의 단추를 그대로 눌러 상태를 맞춘다 */
addEventListener("message", (e) => {
  const c = e.data && e.data.ax;
  if (c !== "play" && c !== "pause") return;
  if ((c === "play") !== st.playing) document.getElementById("play").click();
});

document.addEventListener("keydown", e => {
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); setPlaying(!st.playing); }
  if (e.code === "KeyR") document.getElementById("replay").click();
});

document.getElementById("replay").onclick = () => {
  setPlaying(true);
  st.frozen = false; st.intro = true; st.scene = 0; st.sceneT = 0;
  for (const k in st.prog) st.prog[k] = 0;
  st.dayProg = 0; st.dayHold = 0;
  parts.length = 0; st.flashes.length = 0;
  walkers.length = 0; walkBudget = 0;
  eAct.fill(0); nAct.fill(0);
  offKey = "";
  cam.tx = 0; cam.ty = 0; cam.tz = 1;
};
document.getElementById("fit").onclick = () => { cam.tx = 0; cam.ty = 0; cam.tz = 1; closePanel(); };
document.getElementById("ratio").onchange = e => { CFG.ratio = e.target.value; layoutSize(); };
document.getElementById("full").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else stageEl.requestFullscreen?.();
};
for (const b of document.querySelectorAll(".tg")) {
  b.onclick = () => {
    const k = b.dataset.layer;
    st.layers[k] = !st.layers[k];
    b.classList.toggle("off", !st.layers[k]);
  };
}

const $bar = document.getElementById("bar");
let hideTimer = null;
function flashBar(ms) {
  $bar.classList.add("show");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => $bar.classList.remove("show"), ms);
}

/* 시작 */
document.getElementById("ratio").value = CFG.ratio;
layoutSize();
// ?q=낱말 로 열면 그 낱말이 걸린 페이지만 밝힌 지도를 보여 준다. 보고서에 끼울 때 쓴다.
if (P.has("q")) { $q.value = P.get("q"); runSearch(); }
if (!P.has("stage") && CFG.autoplay) flashBar(2600);
requestAnimationFrame(t => { prev = t; tick(t); });
</script>
</body>
</html>
